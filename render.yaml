services:
  - type: web
    name: seat-reservation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_MAX_CONNS
        value: "25"
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString

databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seats
    user: seats
