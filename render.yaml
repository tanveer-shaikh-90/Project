# Render.com blueprint — one-click deploy of the API + a free Postgres.
# In Render: New + -> Blueprint -> point at this repo. Render reads this file.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_MAX_CONNS
        value: "25"
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString

databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seats
    user: seats
